name: Deploy PATRIMONIO
on:
  workflow_dispatch:
    inputs:
      netlify_token:
        description: "Netlify Personal Access Token"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup deploy directory
        run: |
          mkdir -p deploy_dir
          cp patrimonio-app.html deploy_dir/index.html
          printf '[[headers]]\n  for = "/*"\n  [headers.values]\n    Content-Type = "text/html; charset=utf-8"\n' > deploy_dir/netlify.toml
          printf '/index.html\n  Content-Type: text/html; charset=utf-8\n/*\n  Content-Type: text/html; charset=utf-8\n' > deploy_dir/_headers
          ls -la deploy_dir/

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy via Netlify CLI
        env:
          NETLIFY_AUTH_TOKEN: ${{ github.event.inputs.netlify_token }}
          NETLIFY_SITE_ID: d9fb18a5-7633-4703-bf75-85fb0040ac4c
        run: |
          netlify deploy --dir=deploy_dir --prod --message="PATRIMONIO deploy via GitHub Actions"
