name: Deploy STATUS COMEX
on:
  workflow_dispatch:
    inputs:
      netlify_token:
        description: "Netlify Personal Access Token"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup deploy directory
        run: |
          mkdir -p deploy_dir
          cp status-comex-app.html deploy_dir/index.html
          
          cat > deploy_dir/netlify.toml << 'TOML'
[[headers]]
  for = "/*"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
TOML
          
          cat > deploy_dir/_headers << 'HEADERS'
/index.html
  Content-Type: text/html; charset=utf-8

/*
  Content-Type: text/html; charset=utf-8
HEADERS
          
          echo "Deploy dir contents:"
          ls -la deploy_dir/
          echo "netlify.toml:"
          cat deploy_dir/netlify.toml

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy via Netlify CLI
        env:
          NETLIFY_AUTH_TOKEN: ${{ github.event.inputs.netlify_token }}
          NETLIFY_SITE_ID: bb8cb106-d40e-4cb9-8241-b1b550c00b46
        run: |
          netlify deploy --dir=deploy_dir --prod --message="STATUS COMEX with correct charset"
